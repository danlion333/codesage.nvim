[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesage"
version = "0.1.0"
description = "AI-powered code intelligence for NeoVim"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.40",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "duckduckgo-search>=7.0",
]

[project.scripts]
codesage = "codesage.server:main"

[tool.hatch.build.targets.wheel]
packages = ["python/codesage"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["python"]
line-length = 99

[tool.mypy]
python_version = "3.11"
strict = true
